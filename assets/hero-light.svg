<svg xmlns="http://www.w3.org/2000/svg" viewBox="104 4 376 292" width="376" height="292" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Layered architecture: Data, .NET API, AI/ML</title>
  <desc id="d">Isometric diagram of three stacked layers. Small data cubes rise from the Data layer through the .NET API layer to the AI/ML layer.</desc>
  <style>
  .t{fill:#EEF0F4;stroke:#B4BAC6}
  .l{fill:#D9DDE5;stroke:#B4BAC6}
  .r{fill:#C8CDD7;stroke:#B4BAC6}
  .acc .t{fill:#6D4AE8;stroke:#3F1FAE}
  .acc .l{fill:#512BD4;stroke:#3F1FAE}
  .acc .r{fill:#3F1FAE;stroke:#3F1FAE}
  .t,.l,.r{stroke-width:.75;stroke-linejoin:round}
  .ring{fill:none;stroke:#6D4AE8;stroke-width:1.5;stroke-linejoin:round;opacity:0}
  .pt{fill:#FFFFFF}.pl{fill:#E6E0FC}.pr{fill:#D2C9F7}
  .pt,.pl,.pr{stroke:#512BD4;stroke-width:.75;stroke-linejoin:round}
  .lead{stroke:#B4BAC6;stroke-width:1;fill:none}
  .lbl{font:600 18px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1F2430}
  .sub{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5B6372}
  .slab{animation:float 7s ease-in-out infinite alternate}
  .s2{animation-delay:-2.3s}.s3{animation-delay:-4.6s}
  .packet{opacity:0;animation:rise 7.5s linear infinite}
  .p2{animation-delay:-2.5s}.p3{animation-delay:-5s}
  .ring{animation:pulse 2.5s ease-out 2.5s infinite}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  @keyframes rise{0%{transform:translateY(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateY(-140px);opacity:0}}
  @keyframes pulse{0%{opacity:.9}45%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.slab,.packet,.ring{animation:none}}
  </style>
  <g>
    <g class="slab s3">
      <polygon class="l" points="110,210 230,270 230,282 110,222"/>
      <polygon class="r" points="350,210 230,270 230,282 350,222"/>
      <polygon class="t" points="230,150 350,210 230,270 110,210"/>
    </g>
    <g class="slab s2 acc">
      <polygon class="l" points="110,140 230,200 230,212 110,152"/>
      <polygon class="r" points="350,140 230,200 230,212 350,152"/>
      <polygon class="t" points="230,80 350,140 230,200 110,140"/>
    </g>
    <g class="slab s1">
      <polygon class="l" points="110,70 230,130 230,142 110,82"/>
      <polygon class="r" points="350,70 230,130 230,142 350,82"/>
      <polygon class="t" points="230,10 350,70 230,130 110,70"/>
      <polygon class="ring" points="230,10 350,70 230,130 110,70"/>
    </g>
  </g>
  <g>
    <g transform="translate(230 210)"><g class="packet p1"><polygon class="pl" points="-9,0 0,4.5 0,-4.5 -9,-9"/><polygon class="pr" points="9,0 0,4.5 0,-4.5 9,-9"/><polygon class="pt" points="0,-13.5 9,-9 0,-4.5 -9,-9"/></g></g>
    <g transform="translate(230 210)"><g class="packet p2"><polygon class="pl" points="-9,0 0,4.5 0,-4.5 -9,-9"/><polygon class="pr" points="9,0 0,4.5 0,-4.5 9,-9"/><polygon class="pt" points="0,-13.5 9,-9 0,-4.5 -9,-9"/></g></g>
    <g transform="translate(230 210)"><g class="packet p3"><polygon class="pl" points="-9,0 0,4.5 0,-4.5 -9,-9"/><polygon class="pr" points="9,0 0,4.5 0,-4.5 9,-9"/><polygon class="pt" points="0,-13.5 9,-9 0,-4.5 -9,-9"/></g></g>
  </g>
  <g>
    <path class="lead" d="M360 70 H378"/>
    <text class="lbl" x="388" y="76">AI / ML</text>
    <path class="lead" d="M360 140 H378"/>
    <text class="lbl" x="388" y="146">.NET API</text>
    <path class="lead" d="M360 210 H378"/>
    <text class="lbl" x="388" y="216">Data</text>
  </g>
</svg>

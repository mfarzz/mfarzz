<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Data flows through a .NET API into AI/ML</title><desc id="d">Isometric stack of three plates: DATA at the bottom, .NET API in the middle, AI / ML on top. Small cubes rise from DATA through the .NET API plate to AI / ML.</desc><defs><linearGradient id="tai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F4C5C"/><stop offset="1" stop-color="#0A2E3D"/></linearGradient><linearGradient id="lai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A3A47"/><stop offset="1" stop-color="#072430"/></linearGradient><linearGradient id="rai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062B36"/><stop offset="1" stop-color="#041A22"/></linearGradient><linearGradient id="tnet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E3AE0"/><stop offset="1" stop-color="#4423B8"/></linearGradient><linearGradient id="lnet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E1FA6"/><stop offset="1" stop-color="#321888"/></linearGradient><linearGradient id="rnet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B1275"/><stop offset="1" stop-color="#210E5C"/></linearGradient><linearGradient id="tdat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#244A9E"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient><linearGradient id="ldat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A3175"/><stop offset="1" stop-color="#142559"/></linearGradient><linearGradient id="rdat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11204F"/><stop offset="1" stop-color="#0C173B"/></linearGradient><radialGradient id="bg" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#1a2233"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter><filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter><g id="cb"><circle cx="0" cy="-4" r="10" fill="currentColor" opacity=".45" filter="url(#soft)"/><g stroke="#fff" stroke-opacity=".35" stroke-width=".5" stroke-linejoin="round" fill="currentColor"><polygon points="-8,0 0,4 0,-4 -8,-8"/><polygon points="8,0 0,4 0,-4 8,-8"/><polygon points="0,-12 8,-8 0,-4 -8,-8"/></g><polygon points="-8,0 0,4 0,-4 -8,-8" fill="#000" opacity=".28"/><polygon points="8,0 0,4 0,-4 8,-8" fill="#000" opacity=".5"/></g></defs><style>.rail{fill:none;stroke:#8B949E;stroke-width:1;stroke-dasharray:3 5;opacity:.2}.pill{font:600 12px system-ui,-apple-system,'Segoe UI',Roboto,monospace;letter-spacing:.04em;fill:#E6EDF3}
.cube{opacity:0;color:#3B82F6}
.low.c1{opacity:1;transform:translateY(-60px);color:#3B82F6}
.up.c2{opacity:1;transform:translateY(-112px);color:#8A63D2}
.up.c3{opacity:1;transform:translateY(-152px);color:#00F5D4}
.pulse{opacity:0}
.plate{animation:bob 7.5s ease-in-out infinite}
.pa{animation-delay:0s}.pn{animation-delay:-2.5s}.pd{animation-delay:-5s}
.low{animation:fLow 7.5s linear infinite}
.up{animation:fUp 7.5s linear infinite}

@keyframes fLow{0%{transform:translateY(0);opacity:0;color:#3B82F6}5%{opacity:1}30%{color:#3B82F6}50%{transform:translateY(-112px);opacity:1;color:#8A63D2}50.1%{opacity:0}100%{transform:translateY(-224px);opacity:0}}
@keyframes fUp{0%{transform:translateY(0);opacity:0}49.9%{transform:translateY(-112px);opacity:0;color:#8A63D2}50%{opacity:1;color:#8A63D2}75%{color:#8A63D2}95%{opacity:1;color:#00F5D4}100%{transform:translateY(-224px);opacity:0;color:#00F5D4}}
